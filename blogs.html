<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs | MetaVirta</title>
<link rel="stylesheet" href="style.css">

<style>
  /* Styles for the header with "Create Post" button */
  .page-header {
    display: flex;
    flex-wrap: wrap; /* Allows stacking on mobile */
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1rem;
  }

  /* --- Styles for Modals (Shared) --- */
  .modal-overlay {
    position: fixed; /* Sits on top of all content */
    z-index: 2000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* Dark, semi-transparent */
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
  }
  .modal-content {
    background: var(--bg-content, #fff); /* Uses CSS var, with a fallback */
    padding: 2rem;
    border-radius: var(--radius-md, 12px);
    box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
    width: 90%;
    max-width: 600px; /* Max width for the form */
    animation: slideDown 0.3s ease-out;
    max-height: 90vh; /* Make modal scrollable on small screens */
    overflow-y: auto; /* Add vertical scroll if content is too tall */
  }
  .modal-content h2 {
    margin-top: 0;
  }
  
  /* --- Styles for CREATE POST Modal --- */
  .modal-content label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    margin-top: 1rem;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 1.5rem;
    border-top: 1px solid var(--border-color, #e2e8f0);
    padding-top: 1.5rem;
  }
  
  /* --- Styles for READ POST Modal --- */
  #read-post-modal-content h2 {
    color: var(--primary-color, #2563eb);
  }
  #read-post-modal-content p {
    font-size: 1rem;
    line-height: 1.7;
    white-space: pre-wrap; /* Preserves line breaks from the textarea */
  }
  .modal-actions-close {
    display: flex;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }

  /* --- Styles for Blog Card Actions (including DELETE) --- */
  .blog-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Pushes actions to the bottom */
  }
  .blog-card-content {
    flex-grow: 1; /* Allows content to take up space */
  }
  .blog-card-actions {
    display: flex;
    gap: 0.5rem; /* Space between buttons */
    margin-top: 1rem; /* Space above buttons */
    width: 100%;
  }
  .read-more-btn {
    flex-grow: 1; /* "Read More" takes up most space */
  }
  
  /* This is the CSS for the Delete Button */
  .delete-btn {
    background-color: #fee2e2;
    color: #b91c1c;
    font-weight: 600;
    padding: 0 1rem; /* Make it a bit smaller */
  }
  .delete-btn:hover {
    background-color: #fecaca;
    color: #991b1b;
  }


  /* Animation Keyframes */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideDown {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>

<body id="page-blogs">

<header>
  <h2>MetaVirta</h2>
  <nav>
    <a href="index.html" class="nav-home">Home</a>
    <a href="materials.html" class="nav-materials">Materials</a>
    <a href="quizzes.html" class="nav-quizzes">Quizzes</a>
    <a href="blogs.html" class="nav-blogs">Blogs</a>
    <a href="events.html" class="nav-events">Events</a>
    <a href="forum.html" class="nav-forum">Forum</a>
    <a href="about us.html" class="nav-about">About Us</a>
  </nav>
</header>

<main>
  <div class="page-header">
    <h1>Blog Posts</h1>
    <button class="btn btn-primary" id="open-post-modal-btn">Create Your Own Blog</button>
  </div>

  <div class="card filters-bar">
    <div class="filter-group">
      <label for="blog-search">Search Posts:</label>
      <input type="text" id="blog-search" placeholder="Search by title or content...">
    </div>
  </div>
  
  <div id="blog-grid">
    </div>
</main>

<div id="post-creator-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <form id="post-form">
      <h2>Create New Post</h2>
      <label for="post-title">Title:</label>
      <input type="text" id="post-title" required>
      
      <label for="post-content">Content:</label>
      <textarea id="post-content" rows="8" placeholder="Write your full post here..."></textarea>
      
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-post-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit Post</button>
      </div>
    </form>
  </div>
</div>

<div id="read-post-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content" id="read-post-modal-content">
    <h2 id="read-post-title">Blog Post Title</h2>
    <p id="read-post-body">Full blog post content...</p>
    <div class="modal-actions-close">
      <button type="button" class="btn btn-primary" id="read-post-close-btn">Close</button>
    </div>
  </div>
</div>


<footer>
  © 2025 MyMaterials. All rights reserved.
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // --- 1. DEFAULT POSTS ---
  const defaultPosts = [
    {
      id: 'default-1', // Give default posts string IDs
      title: "Understanding Microstructure",
      content: "Microstructure determines the mechanical properties of materials, including strength, toughness, and ductility. It is the very small scale structure of a material, defined by the arrangement of phases, grains, and defects.\n\nYou can see it under a microscope!"
    },
    {
      id: 'default-2',
      title: "A Guide to Phase Diagrams",
      content: "Phase diagrams are the roadmaps for material scientists. They show which phases are stable at different temperatures, pressures, and compositions.\n\nThe Iron-Carbon (Fe-C) diagram is perhaps the most famous, governing the properties of all steels and cast irons."
    },
    {
      id: 'default-3',
      title: "Failure Analysis: A Case Study",
      content: "When a component fails, investigators look for clues. We analyze a classic case of brittle fracture in a steel bridge that failed in cold weather, linking it back to the Ductile-to-Brittle Transition Temperature (DBTT)."
    }
  ];

  // --- 2. DOM ELEMENT REFERENCES ---
  const blogGrid = document.getElementById('blog-grid');
  const searchInput = document.getElementById('blog-search');
  const createModal = document.getElementById('post-creator-modal');
  const openCreateModalBtn = document.getElementById('open-post-modal-btn');
  const cancelCreateBtn = document.getElementById('cancel-post-btn');
  const postForm = document.getElementById('post-form');
  const readModal = document.getElementById('read-post-modal');
  const readModalTitle = document.getElementById('read-post-title');
  const readModalBody = document.getElementById('read-post-body');
  const readModalCloseBtn = document.getElementById('read-post-close-btn');
  
  // --- 3. FUNCTIONS ---

  /**
   * Loads all posts, filters them, and renders them to the page.
   */
  function loadPosts() {
    const savedPosts = JSON.parse(localStorage.getItem('myBlogPosts')) || [];
    // User posts are reversed so newest appears first
    const allPosts = [...savedPosts.reverse(), ...defaultPosts];
    
    const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

    const filteredPosts = allPosts.filter(post => 
      post.title.toLowerCase().includes(searchTerm) || 
      post.content.toLowerCase().includes(searchTerm)
    );

    if (!blogGrid) return; 
    
    blogGrid.innerHTML = ''; 
    if (filteredPosts.length === 0) {
      blogGrid.innerHTML = '<p class="no-results-main">No posts found matching your search.</p>';
      return;
    }
    
    filteredPosts.forEach(post => {
      const postCard = document.createElement('div');
      postCard.className = 'card blog-card';
      
      const previewText = post.content.substring(0, 100) + (post.content.length > 100 ? '...' : '');
      
      // This is the logic for the Delete Button
      let deleteButtonHTML = '';
      // User posts have a numeric ID (from Date.now()), default posts have a string ID
      if (typeof post.id === 'number') {
        deleteButtonHTML = `
          <button class="btn delete-btn" data-id="${post.id}" title="Delete Post">
            X
          </button>
        `;
      }

      postCard.innerHTML = `
        <div class="blog-card-content">
          <h3>${post.title}</h3>
          <p>${previewText}</p>
        </div>
        <div class="blog-card-actions">
          <button 
            class="btn btn-secondary read-more-btn" 
            data-title="${encodeURIComponent(post.title)}"
            data-content="${encodeURIComponent(post.content)}"
          >
            Read More
          </button>
          ${deleteButtonHTML}
        </div>
      `;
      blogGrid.appendChild(postCard);
    });
  }

  /**
   * Handles submitting the "Create Post" form.
   */
  function handlePostSubmit(e) {
    e.preventDefault(); 
    const title = document.getElementById('post-title').value;
    const content = document.getElementById('post-content').value;
    
    if (!title || !content) {
      alert("Please fill out both fields.");
      return;
    }
    
    // Add a unique ID using a timestamp
    const newPost = { 
      id: Date.now(), 
      title, 
      content 
    };
    
    const savedPosts = JSON.parse(localStorage.getItem('myBlogPosts')) || [];
    
    savedPosts.push(newPost);
    localStorage.setItem('myBlogPosts', JSON.stringify(savedPosts));
    
    postForm.reset();
    closeCreateModal();
    loadPosts(); // Refresh the grid
  }

  /**
   * This is the function that handles deleting
   */
  function handleDeleteClick(e) {
    const postId = Number(e.target.dataset.id); // Get the ID
    if (!postId) return;

    // Show a confirmation dialog
    if (confirm("Are you sure you want to delete this post? This cannot be undone.")) {
      let savedPosts = JSON.parse(localStorage.getItem('myBlogPosts')) || [];
      
      // Filter the array to *remove* the post with the matching ID
      savedPosts = savedPosts.filter(post => post.id !== postId);
      
      // Save the new, smaller array back to localStorage
      localStorage.setItem('myBlogPosts', JSON.stringify(savedPosts));
      
      // Refresh the grid
      loadPosts();
    }
  }

  // --- Functions for Create Modal ---
  function openCreateModal() {
    if (createModal) createModal.style.display = 'flex';
  }
  function closeCreateModal() {
    if (createModal) createModal.style.display = 'none';
  }
  
  // --- Functions for Read Modal ---
  function openReadModal(title, content) {
    readModalTitle.textContent = decodeURIComponent(title);
    readModalBody.textContent = decodeURIComponent(content);
    if (readModal) readModal.style.display = 'flex';
  }
  function closeReadModal() {
    if (readModal) readModal.style.display = 'none';
  }


  // --- 4. EVENT LISTENERS ---
  
  if (searchInput) {
    searchInput.addEventListener('keyup', loadPosts);
  }
  
  // Create Modal Listeners
  if (openCreateModalBtn) {
    openCreateModalBtn.addEventListener('click', openCreateModal);
  }
  if (cancelCreateBtn) {
    cancelCreateBtn.addEventListener('click', closeCreateModal);
  }
  if (postForm) {
    postForm.addEventListener('submit', handlePostSubmit);
  }
  if (createModal) {
    createModal.addEventListener('click', (e) => {
      if (e.target === createModal) {
        closeCreateModal();
      }
    });
  }

  // --- Event Listeners for "Read More" and "Delete" ---
  if (blogGrid) {
    blogGrid.addEventListener('click', (e) => {
      // Check for "Read More" button click
      if (e.target.classList.contains('read-more-btn')) {
        const title = e.target.dataset.title;
        const content = e.target.dataset.content;
        openReadModal(title, content);
      }
      
      // This is the event listener for the Delete Button
      if (e.target.classList.contains('delete-btn')) {
        handleDeleteClick(e);
      }
    });
  }
  
  if (readModalCloseBtn) {
    readModalCloseBtn.addEventListener('click', closeReadModal);
  }
  
  if (readModal) {
    readModal.addEventListener('click', (e) => {
      if (e.target === readModal) {
        closeReadModal();
      }
    });
  }

  // --- 5. INITIAL PAGE LOAD ---
  loadPosts();
  
});
</script>

</body>
</html>
